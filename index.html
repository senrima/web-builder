<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SitusKilat AI Pro - AI Website Builder</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config & Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.25s ease-out forwards',
                        scaleIn: 'scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        slideUp: 'slideUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(12px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #1F2937;
            background-color: #F9FAFB; /* gray-50 */
        }
        
        .text-gradient {
            background-image: linear-gradient(90deg, #4F46E5, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .reveal {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .dark-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .dark-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
        .dark-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="overflow-hidden h-screen w-full">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CLOUDFLARE_WORKER_URL = "https://situskilat-auth-bridge.username.workers.dev";

        const TEMPLATES = {
            saas: `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaSaaS - Masa Depan Kerja Tim</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 min-h-screen">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 px-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <span class="text-xl font-extrabold text-indigo-600">LuminaSaaS</span>
            <nav class="hidden md:flex gap-6 text-sm font-semibold text-gray-500">
                <a href="#" class="hover:text-indigo-600">Fitur</a>
                <a href="#" class="hover:text-indigo-600">Harga</a>
            </nav>
            <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-gray-800 transition">Mulai Gratis</button>
        </div>
    </header>
    <section class="py-24 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-gray-900">Sinkronisasi Tim <span class="text-indigo-600">Tanpa Batas</span></h1>
        <p class="text-lg text-gray-500 mb-10">Tingkatkan produktivitas perusahaan dengan platform kolaborasi dan analitik paling intuitif di dunia.</p>
        <button class="bg-indigo-600 text-white px-8 py-4 rounded-full font-bold shadow-lg shadow-indigo-600/30 hover:scale-105 transition transform">Jadwalkan Demo</button>
    </section>
</body>
</html>`,
            coffee: `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Wangi - Seduhan Estetik</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>h1, h2 { font-family: 'Playfair Display', serif; } body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-stone-50 text-stone-800">
    <nav class="p-6 max-w-5xl mx-auto flex justify-between items-center">
        <span class="text-2xl font-extrabold text-stone-900 tracking-widest">KOPI WANGI</span>
        <button class="border border-stone-800 text-stone-800 px-6 py-2 text-sm font-bold uppercase tracking-widest hover:bg-stone-800 hover:text-white transition">Menu</button>
    </nav>
    <section class="py-20 px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 text-stone-900">Ketenangan di Setiap<br><span class="italic font-light text-stone-500">Tetesan Seduhan</span></h1>
        <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=800&q=80" class="mx-auto rounded-2xl shadow-2xl mt-12 w-full max-w-3xl object-cover h-[400px]">
    </section>
</body>
</html>`
        };

        function App() {
            // State Inti Layout & Mode
            const [viewMode, setViewMode] = useState('editor'); // 'editor' | 'browser'
            const [editorTab, setEditorTab] = useState('preview'); // 'preview' | 'code' -> Mengatur tampilan di panel kanan
            const [previewMode, setPreviewMode] = useState('desktop'); // 'desktop' | 'tablet' | 'mobile'
            
            // State Builder Utama
            const [prompt, setPrompt] = useState('');
            const [generatedCode, setGeneratedCode] = useState(TEMPLATES.saas);
            const [isLoading, setIsLoading] = useState(false);

            // State Keamanan Server
            const [workerUrl, setWorkerUrl] = useState(() => localStorage.getItem('situs_kilat_worker_url') || CLOUDFLARE_WORKER_URL);
            const [serverStatus, setServerStatus] = useState('idle');

            // Riwayat Kode
            const [history, setHistory] = useState([TEMPLATES.saas]);
            const [historyIndex, setHistoryIndex] = useState(0);

            // State Modal & Notifikasi
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            // State Simulasi DNS
            const [subdomainInput, setSubdomainInput] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);
            const [publishStep, setPublishStep] = useState(0);
            const [terminalLogs, setTerminalLogs] = useState([]);
            const [publishedSites, setPublishedSites] = useState([]);
            const [browserAddress, setBrowserAddress] = useState('');

            // Efek Render Visual (Reveal)
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('active');
                    });
                }, { threshold: 0.1 });

                const revealElements = document.querySelectorAll('.reveal');
                revealElements.forEach(el => observer.observe(el));

                return () => revealElements.forEach(el => observer.unobserve(el));
            }, [viewMode, editorTab]);

            // Inisialisasi awal
            useEffect(() => {
                localStorage.setItem('situs_kilat_worker_url', workerUrl);
                const savedSites = localStorage.getItem('situs_kilat_published_sites');
                if (savedSites) setPublishedSites(JSON.parse(savedSites));
                testWorkerConnection();
            }, [workerUrl]);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            const testWorkerConnection = async () => {
                setServerStatus('idle');
                try {
                    const response = await fetch(workerUrl, { method: "GET" });
                    setServerStatus(response.ok ? 'connected' : 'failed');
                } catch (e) {
                    setServerStatus('failed');
                }
            };

            const fetchApiKeyFromWorker = async () => {
                try {
                    const response = await fetch(workerUrl, { method: "GET" });
                    if (!response.ok) throw new Error(`Worker HTTP error: ${response.status}`);
                    const data = await response.json();
                    if (data && data.success && data.apiKey) {
                        setServerStatus('connected');
                        return data.apiKey;
                    }
                    throw new Error(data.error || "Skema respon JSON salah.");
                } catch (err) {
                    setServerStatus('failed');
                    throw new Error(`Gagal menarik kunci: ${err.message}`);
                }
            };

            const updateCodeWithHistory = (newCode) => {
                const updatedHistory = history.slice(0, historyIndex + 1);
                updatedHistory.push(newCode);
                setHistory(updatedHistory);
                setHistoryIndex(updatedHistory.length - 1);
                setGeneratedCode(newCode);
            };

            const handleUndo = () => {
                if (historyIndex > 0) {
                    setHistoryIndex(historyIndex - 1);
                    setGeneratedCode(history[historyIndex - 1]);
                }
            };

            const handleRedo = () => {
                if (historyIndex < history.length - 1) {
                    setHistoryIndex(historyIndex + 1);
                    setGeneratedCode(history[historyIndex + 1]);
                }
            };

            const fetchWithBackoff = async (url, options, retries = 5, delay = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (retries === 0) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithBackoff(url, options, retries - 1, delay * 2);
                }
            };

            const handleAiGeneration = async (isEdit = false) => {
                if (!prompt.trim()) return showToast('Masukkan instruksi Anda!', 'error');

                setIsLoading(true);
                setViewMode('editor');
                setEditorTab('preview'); // Kembalikan ke panel preview saat AI memproses

                let secureApiKey = "";
                try {
                    secureApiKey = await fetchApiKeyFromWorker();
                } catch (err) {
                    setIsLoading(false);
                    showToast("API Key gagal ditarik dari Cloudflare.", "error");
                    setShowSettingsModal(true);
                    return;
                }

                const systemPrompt = isEdit
                    ? `Anda adalah AI perancang web tingkat lanjut. Modifikasi kode HTML berikut sesuai instruksi. 
                      Pertahankan gaya modern dan responsif. Berikan HANYA kode HTML mentah yang utuh.`
                    : `Anda adalah AI perancang web satu halaman (Single Page) modern menggunakan Tailwind CSS. 
                      Keluarkan HANYA kode HTML5 mandiri yang valid dan utuh tanpa bungkus markdown. 
                      Desain harus terang, bersih, mewah dengan whitespace lega dan font Google 'Plus Jakarta Sans' atau 'Poppins'. Gunakan aset Unsplash berkualitas tinggi.`;

                const userPromptText = isEdit
                    ? `KODE SAAT INI:\n${generatedCode}\n\nINSTRUKSI REVISI:\n${prompt}\nBerikan seluruh HTML secara lengkap.`
                    : prompt;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${secureApiKey}`;

                try {
                    const data = await fetchWithBackoff(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userPromptText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    let rawHtml = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawHtml) throw new Error('Respons AI kosong.');

                    let cleanedCode = rawHtml.trim();
                    if (cleanedCode.includes('```html')) cleanedCode = cleanedCode.split('```html')[1].split('```')[0];
                    else if (cleanedCode.includes('```')) cleanedCode = cleanedCode.split('```')[1].split('```')[0];
                    
                    updateCodeWithHistory(cleanedCode.trim());
                    setPrompt('');
                    showToast('Website berhasil dirancang!', 'success');
                } catch (error) {
                    showToast(`Gagal memproses: ${error.message}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const executePublishFlow = () => {
                if (!subdomainInput.trim()) return showToast('Tentukan nama subdomain!', 'error');
                const cleanSubdomain = subdomainInput.toLowerCase().replace(/[^a-z0-9-]/g, '');
                if (publishedSites.some(s => s.subdomain === cleanSubdomain)) return showToast('Subdomain telah digunakan!', 'error');

                setIsPublishing(true);
                setPublishStep(1);
                setTerminalLogs([]);

                const logIt = (text, delay) => new Promise(r => setTimeout(() => {
                    setTerminalLogs(prev => [...prev, `> ${text}`]);
                    r();
                }, delay));

                logIt('Membuat DNS Record virtual...', 0)
                    .then(() => logIt('Mengekspor file index.html...', 800))
                    .then(() => { setPublishStep(2); return logIt('Menyebarkan ke node CDN Global...', 1000); })
                    .then(() => { setPublishStep(3); return logIt('Menerbitkan sertifikat SSL Let\'s Encrypt...', 900); })
                    .then(() => { setPublishStep(4); return logIt('Subdomain berhasil diluncurkan!', 600); })
                    .then(() => {
                        const newSites = [{
                            subdomain: cleanSubdomain,
                            code: generatedCode,
                            title: generatedCode.match(/<title>([^<]*)<\/title>/i)?.[1] || 'Situs Baru'
                        }, ...publishedSites];
                        setPublishedSites(newSites);
                        localStorage.setItem('situs_kilat_published_sites', JSON.stringify(newSites));
                        setIsPublishing(false);
                        showToast('Website berhasil Go Live!', 'success');
                    });
            };

            // TAMPILAN BLOKIR UNTUK MOBILE (Hanya Desktop)
            const MobileBlocker = () => (
                <div className="flex lg:hidden fixed inset-0 z-[9999] bg-white flex-col items-center justify-center p-8 text-center">
                    <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-6">
                        <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <h1 className="text-2xl font-extrabold text-gray-900 mb-3">Mohon Buka di Desktop</h1>
                    <p className="text-gray-500 text-sm leading-relaxed max-w-sm">
                        SitusKilat AI Pro adalah lingkungan perancangan web kompleks yang memerlukan layar lebar. Silakan akses tautan ini melalui komputer atau laptop Anda.
                    </p>
                </div>
            );

            return (
                <React.Fragment>
                    <MobileBlocker />
                    
                    {/* Aplikasi Utama (Tersembunyi di Mobile, Muncul di LG ke atas) */}
                    <div className="hidden lg:flex flex-col h-screen w-full bg-gray-50 overflow-hidden font-sans">
                        
                        {/* Notifikasi Toast */}
                        {toast.show && (
                            <div className={`fixed top-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all border text-sm animate-fadeIn \${
                                toast.type === 'success' ? 'bg-white border-green-100 text-green-700' :
                                toast.type === 'error' ? 'bg-white border-red-100 text-red-700' : 'bg-white border-indigo-100 text-indigo-700'
                            }`}>
                                <p className="font-semibold">{toast.message}</p>
                            </div>
                        )}

                        {/* Top Header Menempel */}
                        <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-lg border-b border-gray-200 flex items-center justify-between px-6 py-4 shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <div>
                                    <span className="text-lg font-extrabold tracking-tight text-gray-900">
                                        SitusKilat <span className="text-gradient">AI Pro</span>
                                    </span>
                                </div>
                            </div>

                            {/* View Switcher (Editor vs Situs Live) */}
                            <div className="flex items-center bg-gray-100 p-1.5 rounded-xl border border-gray-200">
                                <button 
                                    onClick={() => setViewMode('editor')}
                                    className={`px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition-all duration-200 \${viewMode === 'editor' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    Ruang Kerja
                                </button>
                                <button 
                                    onClick={() => {
                                        if (publishedSites.length === 0) return showToast('Terbitkan website terlebih dahulu!', 'info');
                                        setViewMode('browser');
                                        setBrowserAddress(`https://\${publishedSites[0].subdomain}.situskilat.id`);
                                    }}
                                    className={`px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition-all duration-200 \${viewMode === 'browser' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                                    Website Live
                                </button>
                            </div>

                            <div className="flex items-center gap-3">
                                <button onClick={() => setShowSettingsModal(true)} className="p-2.5 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 rounded-xl transition" title="Pengaturan Server">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </button>
                                <button 
                                    onClick={() => { setSubdomainInput(''); setPublishStep(0); setShowPublishModal(true); }}
                                    className="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-blue-500 text-white rounded-full text-sm font-bold shadow-lg shadow-blue-500/30 transform hover:scale-105 hover:opacity-90 transition-all flex items-center gap-2"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                    Go Live
                                </button>
                            </div>
                        </header>

                        {/* Ruang Kerja 2 Kolom (Tidak Padat) */}
                        <div className="flex flex-1 overflow-hidden p-5 gap-5">
                            
                            {viewMode === 'editor' && (
                                <React.Fragment>
                                    {/* Kolom Kiri: AI & Kontrol (Lebar Tetap) */}
                                    <aside className="w-[420px] bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col flex-shrink-0 overflow-hidden">
                                        <div className="p-5 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                                            <h3 className="font-bold text-gray-900">Perancang AI</h3>
                                            <div className="flex gap-1">
                                                <button onClick={handleUndo} disabled={historyIndex === 0} className="p-1.5 text-gray-500 hover:text-indigo-600 bg-white border border-gray-200 rounded disabled:opacity-30"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4z"></path></svg></button>
                                                <button onClick={handleRedo} disabled={historyIndex >= history.length - 1} className="p-1.5 text-gray-500 hover:text-indigo-600 bg-white border border-gray-200 rounded disabled:opacity-30"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 005 8v8a1 1 0 001.6.8l5.334-4z"></path></svg></button>
                                            </div>
                                        </div>

                                        <div className="flex-1 overflow-y-auto p-5 custom-scrollbar space-y-6">
                                            
                                            {/* AI Prompt Input */}
                                            <div className="space-y-3">
                                                <div className="relative">
                                                    <textarea
                                                        value={prompt}
                                                        onChange={(e) => setPrompt(e.target.value)}
                                                        placeholder="Jelaskan desain web impian Anda dengan detail di sini..."
                                                        className="w-full bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:bg-white rounded-xl p-4 text-sm text-gray-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition-all duration-200 resize-none h-40 leading-relaxed shadow-inner"
                                                        disabled={isLoading}
                                                    />
                                                </div>
                                                
                                                <div className="flex flex-wrap gap-2">
                                                    <button onClick={() => setPrompt(prev => prev + " dengan palet warna putih minimalis, bersih, elegan.")} className="px-3 py-1.5 text-xs bg-gray-50 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 rounded-lg border border-gray-200 transition">🌿 Minimalis</button>
                                                    <button onClick={() => setPrompt(prev => prev + " dengan palet gelap (dark mode), neon biru dan ungu.")} className="px-3 py-1.5 text-xs bg-gray-50 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 rounded-lg border border-gray-200 transition">🌙 Dark Mode</button>
                                                    <button onClick={() => setPrompt(prev => prev + " tambahkan animasi hover yang smooth dan desain kartu modern.")} className="px-3 py-1.5 text-xs bg-gray-50 hover:bg-indigo-50 text-gray-600 hover:text-indigo-600 rounded-lg border border-gray-200 transition">✨ Dinamis</button>
                                                </div>

                                                <div className="grid grid-cols-2 gap-3 pt-2">
                                                    <button onClick={() => handleAiGeneration(false)} disabled={isLoading} className="py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" /></svg> Buat Baru
                                                    </button>
                                                    <button onClick={() => handleAiGeneration(true)} disabled={isLoading} className="py-3 bg-white border border-gray-200 text-indigo-600 hover:bg-gray-50 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg> Edit Area
                                                    </button>
                                                </div>
                                            </div>

                                            <hr className="border-gray-100" />

                                            {/* Templates List */}
                                            <div className="space-y-3">
                                                <h4 className="text-sm font-bold text-gray-900">Templat Dasar</h4>
                                                <div className="space-y-2">
                                                    <button onClick={() => updateCodeWithHistory(TEMPLATES.saas)} className="w-full p-4 bg-white hover:bg-gray-50 border border-gray-200 rounded-xl flex items-center gap-4 text-left transition group">
                                                        <div className="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition">
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                                        </div>
                                                        <div>
                                                            <h5 className="font-semibold text-gray-900 text-sm">Corporate SaaS</h5>
                                                            <p className="text-xs text-gray-500">Startup & Agensi</p>
                                                        </div>
                                                    </button>
                                                    <button onClick={() => updateCodeWithHistory(TEMPLATES.coffee)} className="w-full p-4 bg-white hover:bg-gray-50 border border-gray-200 rounded-xl flex items-center gap-4 text-left transition group">
                                                        <div className="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition">
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                                        </div>
                                                        <div>
                                                            <h5 className="font-semibold text-gray-900 text-sm">Café Bistro</h5>
                                                            <p className="text-xs text-gray-500">Elegan & Hangat</p>
                                                        </div>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </aside>

                                    {/* Kolom Kanan: Canvas Pratinjau & Kode (Lebar Fleksibel) */}
                                    <main className="flex-1 bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden relative">
                                        {/* Canvas Header & Toggles */}
                                        <div className="px-5 py-3 border-b border-gray-200 flex items-center justify-between bg-gray-50/50">
                                            
                                            {/* Tab: Pratinjau vs Kode */}
                                            <div className="flex items-center bg-gray-200/60 p-1 rounded-lg">
                                                <button 
                                                    onClick={() => setEditorTab('preview')}
                                                    className={`px-5 py-1.5 rounded-md text-sm font-semibold transition-all \${editorTab === 'preview' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500 hover:text-gray-900'}`}
                                                >
                                                    Visual
                                                </button>
                                                <button 
                                                    onClick={() => setEditorTab('code')}
                                                    className={`px-5 py-1.5 rounded-md text-sm font-semibold transition-all \${editorTab === 'code' ? 'bg-white text-indigo-600 shadow' : 'text-gray-500 hover:text-gray-900'}`}
                                                >
                                                    Kode Sumber
                                                </button>
                                            </div>

                                            <div className="flex items-center gap-3">
                                                {/* Device Switcher (Hanya saat mode preview) */}
                                                {editorTab === 'preview' && (
                                                    <div className="flex items-center gap-1">
                                                        <button onClick={() => setPreviewMode('desktop')} className={`p-2 rounded-lg transition \${previewMode === 'desktop' ? 'bg-indigo-50 text-indigo-600' : 'text-gray-400 hover:text-gray-700'}`}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></button>
                                                        <button onClick={() => setPreviewMode('tablet')} className={`p-2 rounded-lg transition \${previewMode === 'tablet' ? 'bg-indigo-50 text-indigo-600' : 'text-gray-400 hover:text-gray-700'}`}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></button>
                                                        <button onClick={() => setPreviewMode('mobile')} className={`p-2 rounded-lg transition \${previewMode === 'mobile' ? 'bg-indigo-50 text-indigo-600' : 'text-gray-400 hover:text-gray-700'}`}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></button>
                                                    </div>
                                                )}

                                                <div className="w-px h-6 bg-gray-200"></div>

                                                <button onClick={() => {
                                                    const blob = new Blob([generatedCode], { type: 'text/html' });
                                                    const a = document.createElement('a');
                                                    a.href = URL.createObjectURL(blob);
                                                    a.download = 'index.html';
                                                    a.click();
                                                    showToast('File diunduh');
                                                }} className="text-gray-500 hover:text-indigo-600 font-semibold text-sm flex items-center gap-1.5 transition">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                                    Unduh
                                                </button>
                                            </div>
                                        </div>

                                        {/* Canvas Area Container */}
                                        <div className="flex-1 relative bg-gray-100 overflow-hidden flex items-center justify-center p-4">
                                            {isLoading && (
                                                <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-30 flex flex-col items-center justify-center animate-fadeIn">
                                                    <div className="w-12 h-12 rounded-full border-4 border-indigo-100 border-t-indigo-600 animate-spin mb-4"></div>
                                                    <h4 className="font-bold text-gray-900">Merender Desain AI...</h4>
                                                </div>
                                            )}

                                            {/* PRATINJAU VISUAL */}
                                            {editorTab === 'preview' && (
                                                <div className={`h-full transition-all duration-300 shadow-xl overflow-hidden \${
                                                    previewMode === 'mobile' ? 'w-[375px] rounded-[40px] border-[6px] border-gray-900' : 
                                                    previewMode === 'tablet' ? 'w-[768px] rounded-[30px] border-[6px] border-gray-900' : 'w-full rounded-xl border border-gray-300'
                                                }`}>
                                                    <iframe srcDoc={generatedCode} className="w-full h-full border-none bg-white" sandbox="allow-scripts allow-same-origin"/>
                                                </div>
                                            )}

                                            {/* EDITOR KODE (VS Code Style / Dark Mode untuk kontras) */}
                                            {editorTab === 'code' && (
                                                <div className="w-full h-full bg-[#0f172a] rounded-xl shadow-inner border border-gray-800 flex flex-col overflow-hidden animate-fadeIn">
                                                    <div className="bg-[#1e293b] px-4 py-2 border-b border-gray-700 flex justify-between items-center">
                                                        <span className="text-gray-400 text-xs font-mono">index.html</span>
                                                        <button onClick={() => {
                                                            navigator.clipboard.writeText(generatedCode);
                                                            showToast('Kode disalin!');
                                                        }} className="text-xs text-indigo-400 hover:text-indigo-300 font-mono">Salin Kode</button>
                                                    </div>
                                                    <textarea
                                                        value={generatedCode}
                                                        onChange={(e) => {
                                                            setGeneratedCode(e.target.value);
                                                            const hist = history.slice(0, historyIndex + 1);
                                                            hist.push(e.target.value);
                                                            setHistory(hist);
                                                            setHistoryIndex(hist.length - 1);
                                                        }}
                                                        className="w-full h-full bg-transparent text-gray-300 p-4 font-mono text-sm resize-none outline-none dark-scrollbar leading-relaxed"
                                                        spellCheck={false}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    </main>
                                </React.Fragment>
                            )}

                            {/* View Mode: BROWSER / SITUS LIVE */}
                            {viewMode === 'browser' && (
                                <main className="flex-1 bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden animate-fadeIn">
                                    <div className="p-4 bg-gray-50 border-b border-gray-200 flex items-center gap-4">
                                        <div className="flex gap-2">
                                            <span className="w-3 h-3 rounded-full bg-red-400"></span>
                                            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
                                            <span className="w-3 h-3 rounded-full bg-green-400"></span>
                                        </div>
                                        <button onClick={() => setViewMode('editor')} className="p-1.5 text-gray-500 hover:text-gray-900 bg-white rounded shadow-sm border border-gray-200">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                        </button>
                                        <div className="flex-1 bg-white border border-gray-200 rounded-lg px-4 py-2 flex items-center justify-between shadow-inner">
                                            <div className="flex items-center gap-2 text-sm text-gray-600 w-full">
                                                <svg className="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                                <span>https://</span>
                                                <input value={browserAddress.replace('https://', '')} onChange={(e) => setBrowserAddress(`https://\${e.target.value}`)} className="flex-1 outline-none text-gray-900 font-medium" />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex-1 bg-white relative">
                                        <iframe 
                                            srcDoc={
                                                publishedSites.find(s => s.subdomain === browserAddress.replace('https://', '').replace('.situskilat.id', ''))?.code || 
                                                `<div style="padding:40px;text-align:center;font-family:sans-serif;"><h1>404</h1><p>Situs tidak ditemukan</p></div>`
                                            }
                                            className="w-full h-full border-none" sandbox="allow-scripts allow-same-origin"
                                        />
                                    </div>
                                </main>
                            )}
                        </div>

                        {/* MODALS */}
                        {showPublishModal && (
                            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                                <div className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl animate-scaleIn">
                                    <h3 className="text-2xl font-extrabold text-gray-900 mb-2">Terbitkan Website</h3>
                                    <p className="text-gray-500 text-sm mb-6">Miliki link kustom instan di server DNS kami.</p>

                                    {publishStep === 0 ? (
                                        <div className="space-y-5">
                                            <div className="flex items-center bg-gray-50 border border-gray-200 focus-within:border-indigo-500 rounded-xl px-4 py-3.5 transition">
                                                <input type="text" placeholder="nama-proyek" value={subdomainInput} onChange={(e) => setSubdomainInput(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ''))} className="bg-transparent outline-none flex-1 font-bold text-gray-900 text-right pr-1"/>
                                                <span className="text-indigo-600 font-bold">.situskilat.id</span>
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={() => setShowPublishModal(false)} className="flex-1 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition">Batal</button>
                                                <button onClick={executePublishFlow} className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition shadow-lg shadow-indigo-600/30">Luncurkan</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-6">
                                            {publishStep < 4 ? (
                                                <div className="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
                                            ) : (
                                                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6"><svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg></div>
                                            )}
                                            <h4 className="font-bold text-gray-900 text-lg">{publishStep < 4 ? 'Menyiapkan DNS...' : 'Situs Mengudara!'}</h4>
                                            {publishStep === 4 && (
                                                <button onClick={() => { setShowPublishModal(false); setViewMode('browser'); setBrowserAddress(`https://\${subdomainInput}.situskilat.id`); }} className="mt-6 w-full py-3.5 bg-gray-900 text-white rounded-xl font-bold hover:bg-gray-800 transition">Buka Tautan</button>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {showSettingsModal && (
                            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                                <div className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl animate-scaleIn">
                                    <h3 className="text-2xl font-extrabold text-gray-900 mb-2">Pengaturan Server</h3>
                                    <p className="text-gray-500 text-sm mb-6">Kelola koneksi Cloudflare Worker Anda.</p>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase tracking-wide">Endpoint Worker URL</label>
                                            <input type="text" value={workerUrl} onChange={(e) => setWorkerUrl(e.target.value)} className="mt-2 w-full bg-gray-50 border border-gray-200 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none transition" />
                                        </div>
                                        <div className="p-4 bg-gray-50 rounded-xl text-xs text-gray-600">
                                            Status: <strong className={serverStatus === 'connected' ? 'text-green-600' : 'text-red-600'}>{serverStatus === 'connected' ? 'Terhubung (Aman)' : 'Tidak Valid'}</strong>
                                        </div>
                                        <button onClick={() => { testWorkerConnection(); setShowSettingsModal(false); }} className="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/30">Simpan Konfigurasi</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
