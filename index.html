<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Builder - S-Tools ID</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config & Animations -->
    <script>
        tailwind.config = {
            darkMode: 'class', // Sistem Dark Mode diaktifkan
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    animation: {
                        fadeIn: 'fadeIn 0.25s ease-out forwards',
                        scaleIn: 'scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        slideUp: 'slideUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(12px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        .text-gradient {
            background-image: linear-gradient(90deg, #4F46E5, #3B82F6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; text-fill-color: transparent;
        }

        .reveal {
            opacity: 0; transform: translateY(15px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .section-bg-glow {
            position: relative;
            overflow: hidden;
        }
        .section-bg-glow::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, rgba(59, 130, 246, 0.03) 40%, transparent 70%);
            opacity: 0; transition: opacity 2s ease-in-out; pointer-events: none; z-index: 0;
        }
        .section-bg-glow.glow-active::after { opacity: 1; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Dark Mode Scrollbar */
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .dark-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .dark-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="overflow-hidden h-screen w-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🛡️ DOMAIN UTAMA S-TOOLS ID
        // ==========================================
        const DEFAULT_WORKER_URL = "https://web.s-tools.id";
        
        // HASH PIN KEAMANAN (Base64 dari PIN untuk Obfuscation Code agar tidak mudah dicari)
        const SECURE_PIN_HASH = "MjM2OTk5"; 

        const INITIAL_CODE = `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Tools Web Platform</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 min-h-screen">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 px-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <span class="text-xl font-extrabold text-indigo-600">Perusahaan Global</span>
            <nav class="hidden md:flex gap-6 text-sm font-semibold text-gray-500">
                <a href="#" class="hover:text-indigo-600">Beranda</a>
                <a href="#" class="hover:text-indigo-600">Layanan</a>
            </nav>
            <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-gray-800 transition shadow-md">Kontak</button>
        </div>
    </header>
    <section class="py-24 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-gray-900">Solusi Bisnis <span class="text-indigo-600">Tanpa Batas</span></h1>
        <p class="text-lg text-gray-500 mb-10 px-4 md:px-12">Tingkatkan produktivitas perusahaan dengan layanan terbaik dan paling intuitif di dunia digital saat ini.</p>
        <button class="bg-indigo-600 text-white px-8 py-4 rounded-full font-bold shadow-lg shadow-indigo-600/30 hover:-translate-y-1 transition transform">Pelajari Lebih Lanjut</button>
    </section>
</body>
</html>`;

        function App() {
            // States
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('situs_kilat_theme');
                if (saved !== null) {
                    return saved === 'dark';
                }
                return true; 
            });
            const [viewMode, setViewMode] = useState('editor'); 
            const [editorTab, setEditorTab] = useState('preview'); 
            const [previewMode, setPreviewMode] = useState('desktop'); 
            const [isFullscreen, setIsFullscreen] = useState(false); 
            
            const [prompt, setPrompt] = useState('');
            const [generatedCode, setGeneratedCode] = useState(INITIAL_CODE);
            const [isLoading, setIsLoading] = useState(false);

            const [workerUrl, setWorkerUrl] = useState(() => {
                let saved = localStorage.getItem('situs_kilat_worker_url');
                if (!saved || saved.includes('workers.dev') || saved.includes('nama-anda')) saved = DEFAULT_WORKER_URL;
                if (saved.endsWith('/')) saved = saved.slice(0, -1);
                return saved;
            });
            const [serverStatus, setServerStatus] = useState('idle');

            const [history, setHistory] = useState([INITIAL_CODE]);
            const [historyIndex, setHistoryIndex] = useState(0);

            const [showPinModal, setShowPinModal] = useState(false); 
            const [pinInput, setPinInput] = useState('');
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            const [subdomainInput, setSubdomainInput] = useState('');
            const [checkStatus, setCheckStatus] = useState('idle'); // 'idle' | 'checking' | 'available' | 'taken' | 'error' | 'own_site'
            const [isPublishing, setIsPublishing] = useState(false);
            const [publishStep, setPublishStep] = useState(0);
            const [publishedSites, setPublishedSites] = useState([]);
            const [browserAddress, setBrowserAddress] = useState('');

            // Efek Dark Mode
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('situs_kilat_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('situs_kilat_theme', 'light');
                }
            }, [isDarkMode]);

            // Efek Animasi UI Dinamis
            useEffect(() => {
                const timer = setTimeout(() => {
                    const glowElements = document.querySelectorAll('.section-bg-glow');
                    glowElements.forEach(el => el.classList.add('glow-active'));
                }, 150);

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('active');
                    });
                }, { threshold: 0.1 });

                const revealElements = document.querySelectorAll('.reveal');
                revealElements.forEach(el => observer.observe(el));

                return () => {
                    clearTimeout(timer);
                    revealElements.forEach(el => observer.unobserve(el));
                };
            }, [viewMode, editorTab, isFullscreen]);

            useEffect(() => {
                let formattedUrl = workerUrl;
                if (formattedUrl.endsWith('/')) formattedUrl = formattedUrl.slice(0, -1);
                localStorage.setItem('situs_kilat_worker_url', formattedUrl);
            }, [workerUrl]);

            useEffect(() => {
                const savedSites = localStorage.getItem('situs_kilat_published_sites');
                if (savedSites) setPublishedSites(JSON.parse(savedSites));
                testWorkerConnection();
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
            };

            // VERIFIKASI PIN PENGATURAN
            const handlePinSubmit = () => {
                if (btoa(pinInput) === SECURE_PIN_HASH) {
                    setShowPinModal(false);
                    setPinInput('');
                    setShowSettingsModal(true);
                } else {
                    showToast('Kode PIN tidak valid!', 'error');
                    setPinInput('');
                }
            };

            const testWorkerConnection = async () => {
                setServerStatus('fetching');
                try {
                    const response = await fetch(`${workerUrl}/auth`, { method: "GET" });
                    setServerStatus(response.ok ? 'connected' : 'failed');
                } catch (e) {
                    setServerStatus('failed');
                }
            };

            const fetchApiKeyFromWorker = async () => {
                try {
                    const response = await fetch(`${workerUrl}/auth`, { method: "GET" });
                    if (!response.ok) throw new Error(`Gateway HTTP error: ${response.status}`);
                    const data = await response.json();
                    if (data && data.success && data.apiKey) {
                        setServerStatus('connected');
                        return data.apiKey;
                    }
                    throw new Error(data.error || "Skema respon JSON salah dari server S-Tools.");
                } catch (err) {
                    setServerStatus('failed');
                    throw new Error(`Gagal menarik kunci API: ${err.message}`);
                }
            };

            const updateCodeWithHistory = (newCode) => {
                const updatedHistory = history.slice(0, historyIndex + 1);
                updatedHistory.push(newCode);
                setHistory(updatedHistory);
                setHistoryIndex(updatedHistory.length - 1);
                setGeneratedCode(newCode);
            };

            const handleUndo = () => {
                if (historyIndex > 0) {
                    setHistoryIndex(historyIndex - 1);
                    setGeneratedCode(history[historyIndex - 1]);
                }
            };

            const handleRedo = () => {
                if (historyIndex < history.length - 1) {
                    setHistoryIndex(historyIndex + 1);
                    setGeneratedCode(history[historyIndex + 1]);
                }
            };

            const handleEditLiveSite = () => {
                const site = publishedSites.find(s => s.liveUrl === browserAddress);
                if (site) {
                    updateCodeWithHistory(site.code);
                    setViewMode('editor');
                    setEditorTab('preview');
                    setPrompt(`Tolong tingkatkan desain bagian...`); 
                    showToast(`Situs ${site.subdomain} berhasil ditarik ke Ruang Kerja siap diedit.`, 'success');
                }
            };

            const fetchWithBackoff = async (url, options, retries = 2, delay = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        const errMsg = errData.error?.message || `HTTP ${response.status}`;
                        if (response.status >= 400 && response.status < 500) throw new Error(`[${response.status}] ${errMsg}`);
                        throw new Error(errMsg);
                    }
                    return await response.json();
                } catch (error) {
                    if (retries === 0 || error.message.includes('[40') || error.message.includes('API key') || error.message.includes('not found')) {
                        throw error;
                    }
                    console.warn(`Mencoba ulang koneksi ke server AI... (${retries} sisa)`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithBackoff(url, options, retries - 1, delay * 2);
                }
            };

            const handleAiGeneration = async (isEdit = false) => {
                if (!prompt.trim()) return showToast('Masukkan instruksi web Anda!', 'error');

                setIsLoading(true);
                setViewMode('editor');
                setEditorTab('preview'); 

                let secureApiKey = "";
                try {
                    secureApiKey = await fetchApiKeyFromWorker();
                    secureApiKey = secureApiKey.trim();
                } catch (err) {
                    setIsLoading(false);
                    showToast(err.message, "error");
                    return;
                }

                // PROMPT KHUSUS UNTUK MEMAKSA ATURAN UI/UX (SPACING, BUTTONS & SOSIAL MEDIA ICONS)
                const systemPrompt = isEdit
                    ? `Anda adalah Senior Web Developer & Ahli UI/UX dengan 20 tahun pengalaman. Lakukan modifikasi kode HTML ini untuk membuatnya JAUH lebih indah, modern, dan pixel-perfect.
                      ATURAN REVISI MUTLAK:
                      1. PERBAIKI SPACING: Teks JANGAN PERNAH menempel di pinggir layar! Selalu gunakan wrapper/container (contoh: <div class="max-w-7xl mx-auto px-6 md:px-12">) pada setiap section.
                      2. PERBAIKI TOMBOL (BUTTON): Semua elemen yang berfungsi sebagai tombol WAJIB memiliki warna background (bg-*), teks kontras, padding tebal (px-6 py-3/px-8 py-4), rounded-full atau rounded-xl, dan hover effect. Jangan sampai tombol hanya terlihat seperti teks biasa!
                      3. PERBAIKI RESPONSIFITAS (MOBILE/TABLET): Pastikan ukuran huruf dan tata letak rapi di layar HP/Tablet. Gunakan kelas responsif Tailwind (contoh: text-3xl md:text-5xl, flex-col md:flex-row, w-full md:w-auto pada tombol) agar UI dan teks tidak berantakan/kebesaran saat layar HP.
                      4. STANDARISASI IKON SOSIAL MEDIA: Semua ikon sosial media WAJIB dimuat menggunakan FontAwesome resmi (<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">). Gunakan kelas resmi murni (contoh: "fab fa-facebook-f", "fab fa-instagram", "fab fa-x-twitter", "fab fa-youtube", "fab fa-whatsapp", "fab fa-tiktok"). JANGAN PERNAH menggambar manual logo media sosial dengan SVG yang melenceng atau simbol cacat lainnya. Letakkan ikon-ikon tersebut di dalam container lingkaran/bulat yang stylish dengan hover transisi warna brand asli.
                      5. Berikan HANYA kode HTML mentah utuh. JANGAN gunakan source.unsplash.com, gunakan picsum.photos atau images.unsplash.com/photo-[id].`
                      
                    : `Anda adalah Senior Web Developer, UI/UX Expert, dan Art Director dengan 20 tahun pengalaman merancang UI/UX website kelas dunia. Buat website modern, mewah, elegan, dan SANGAT MEMPERHATIKAN UI/UX menggunakan Tailwind CSS.
                      ATURAN WAJIB UI/UX TINGKAT TINGGI:
                      1. SPACING & CONTAINER (SANGAT PENTING): Teks atau elemen apa pun JANGAN PERNAH menempel lurus di ujung layar! SELALU gunakan pembungkus utama pada setiap section seperti <div class="max-w-7xl mx-auto px-6 md:px-12 py-16"> agar ada ruang (whitespace) yang lega di kiri, kanan, atas, dan bawah layar.
                      2. DESAIN TOMBOL (BUTTON) YANG JELAS: Semua call-to-action (CTA) WAJIB terlihat sangat jelas sebagai tombol yang bisa diklik. Gunakan padding besar (contoh: px-8 py-3.5), warna background tebal mencolok (contoh: bg-blue-600 text-white), border radius (rounded-full/rounded-xl), shadow (shadow-lg), dan efek transisi (hover:-translate-y-1 hover:shadow-xl transition-all). Jangan pernah membuat tombol yang menyatu/kalah dengan background.
                      3. HIERARKI TIPOGRAFI & RESPONSIFITAS LAYAR (MOBILE/TABLET): Judul harus besar di desktop tapi menyesuaikan di mobile (text-3xl md:text-5xl font-extrabold text-gray-900). Teks deskripsi lebih kecil (text-base md:text-lg text-gray-500). SELALU gunakan prefix responsif Tailwind (md:, lg:) untuk mengatur tata letak. Di layar HP, elemen harus menyusun vertikal (flex-col), tombol tidak bertumpuk berantakan (gunakan w-full atau flex-col gap-3 di mobile), dan teks tidak boleh kebesaran/keluar layar.
                      4. LAYOUT MODERN & IKON SOSIAL MEDIA: Selalu gunakan Flexbox atau Grid (grid-cols-1 md:grid-cols-2 atau 3) untuk menyusun elemen secara profesional. Jika menyertakan bagian "Ikuti Kami" atau Ikon Sosial Media, Anda WAJIB memuat FontAwesome CDN (<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">) di dalam tag <head> dan menggunakan kelas resmi yang benar (seperti "fab fa-facebook-f", "fab fa-instagram", "fab fa-x-twitter", "fab fa-youtube", "fab fa-whatsapp", "fab fa-tiktok"). JANGAN PERNAH menggambar ikon brand secara manual atau menggunakan karakter unicode/simbol yang rusak. Desain ikon sosial media tersebut dengan bungkus lingkaran kecil yang stylish dengan transisi hover warna brand asli masing-masing platform (Facebook: #1877F2, Instagram: #E1306C, X: #000000, Youtube: #FF0000, dsb.).
                      5. GAMBAR/MEDIA: Wajib pakai gambar resolusi tinggi dari https://picsum.photos (contoh: https://picsum.photos/1200/800?random=1) untuk menghidupkan visual. JANGAN pakai source.unsplash.com.
                      6. OUTPUT: Sertakan <meta name="viewport" content="width=device-width, initial-scale=1.0">. Gunakan font "Poppins". Berikan HANYA kode HTML5 mentah utuh tanpa markdown atau penjelasan.`;

                const userPromptText = isEdit
                    ? `KODE SAAT INI:\n${generatedCode}\n\nINSTRUKSI REVISI:\n${prompt}\nBerikan seluruh HTML secara lengkap.`
                    : prompt;

                const modelsToTry = [
                    'gemini-2.5-flash',
                    'gemini-1.5-flash',
                    'gemini-1.5-pro'
                ];

                let responseData = null;
                let lastErrorMsg = "";

                try {
                    for (const modelName of modelsToTry) {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${secureApiKey}`;
                        
                        try {
                            const data = await fetchWithBackoff(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: userPromptText }] }],
                                    systemInstruction: { parts: [{ text: systemPrompt }] }
                                })
                            });
                            responseData = data;
                            break; 
                        } catch (err) {
                            lastErrorMsg = err.message;
                            if (lastErrorMsg.includes('404') || lastErrorMsg.includes('not found')) continue;
                            throw err;
                        }
                    }

                    if (!responseData) throw new Error(`Semua versi model AI tidak tersedia. Error: ${lastErrorMsg}`);

                    let rawHtml = responseData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawHtml) throw new Error('Respons AI kosong atau diblokir filter keamanan.');

                    let cleanedCode = rawHtml.trim();
                    if (cleanedCode.includes('```html')) cleanedCode = cleanedCode.split('```html')[1].split('```')[0];
                    else if (cleanedCode.includes('```')) cleanedCode = cleanedCode.split('```')[1].split('```')[0];
                    
                    updateCodeWithHistory(cleanedCode.trim());
                    setPrompt('');
                    showToast('Desain selesai dirakit dengan sukses!', 'success');
                } catch (error) {
                    let userFriendlyError = error.message;
                    if (error.message.includes('400')) userFriendlyError = "API Key tidak valid atau permintaan ditolak.";
                    if (error.message.includes('403')) userFriendlyError = "Akses terlarang ke AI Server. Coba periksa pengaturan.";
                    showToast(`GAGAL: ${userFriendlyError}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            // ==========================================
            // LOGIKA CEK KETERSEDIAAN SUBDOMAIN YANG DISEMPURNAKAN
            // ==========================================
            const checkAvailability = async () => {
                if (!subdomainInput.trim()) {
                    showToast('Ketikkan nama domain terlebih dahulu!', 'error');
                    return;
                }
                const cleanSubdomain = subdomainInput.toLowerCase().replace(/[^a-z0-9-]/g, '');
                
                // Jika itu adalah situs milik sendiri (Mencegah salah paham "diambil orang")
                const isOwnSite = publishedSites.some(s => s.subdomain === cleanSubdomain);
                if (isOwnSite) {
                    setCheckStatus('own_site');
                    return;
                }

                setCheckStatus('checking');
                try {
                    // Panggil rute website langsung ke Worker untuk mengecek ketersediaannya
                    const response = await fetch(`${workerUrl}/site/${cleanSubdomain}`, {
                        method: 'GET'
                    });
                    
                    // Terbaca 404 artinya nama domain belum terdaftar/bebas dipakai
                    if (response.status === 404) {
                        setCheckStatus('available');
                    } 
                    // Jika mengembalikan 200 OK, berarti situs sudah eksis punya orang lain
                    else if (response.ok) {
                        setCheckStatus('taken');
                    } else {
                        setCheckStatus('error');
                    }
                } catch (err) {
                    // Jika Worker Anda belum di-update dengan kode CORS yang baru, request ini akan GAGAL.
                    // Keamanan kita perketat: Tolak publikasi jika tidak bisa diverifikasi!
                    setCheckStatus('error');
                    showToast('CORS Error: Pastikan Worker Cloudflare Anda sudah diperbarui sesuai arahan AI.', 'error');
                }
            };

            // Reset status saat user mengetik nama baru
            const handleSubdomainChange = (val) => {
                setSubdomainInput(val.toLowerCase().replace(/[^a-z0-9-]/g, ''));
                setCheckStatus('idle'); 
            };

            // ==========================================
            // PUBLISH KE S-TOOLS DATABASE (WEB.S-TOOLS.ID)
            // ==========================================
            const executePublishFlow = async () => {
                if (!subdomainInput.trim()) return showToast('Ketikkan nama domain proyek!', 'error');
                
                // MENGUNCI EKSEKUSI JIKA BELUM CEK DAN STATUS BUKAN MILIK SENDIRI ATAU TERSEDIA
                if (checkStatus !== 'available' && checkStatus !== 'own_site') {
                    return showToast('Harap cek ketersediaan nama proyek hingga berstatus Tersedia!', 'error');
                }
                
                const cleanSubdomain = subdomainInput.toLowerCase().replace(/[^a-z0-9-]/g, '');
                const isOwnSite = publishedSites.some(s => s.subdomain === cleanSubdomain);

                setIsPublishing(true);
                setPublishStep(1);

                try {
                    const response = await fetch(`${workerUrl}/publish`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            subdomain: cleanSubdomain,
                            html: generatedCode,
                            isUpdate: isOwnSite // Mengizinkan update jika milik sendiri
                        })
                    });

                    setPublishStep(2);
                    const result = await response.json();

                    if (result.success) {
                        setPublishStep(4);
                        
                        const newSites = [{
                            subdomain: cleanSubdomain,
                            liveUrl: result.url,
                            code: generatedCode,
                            title: generatedCode.match(/<title>([^<]*)<\/title>/i)?.[1] || 'Situs Kilat'
                        }, ...publishedSites.filter(s => s.subdomain !== cleanSubdomain)];
                        
                        setPublishedSites(newSites);
                        localStorage.setItem('situs_kilat_published_sites', JSON.stringify(newSites));

                                                            <a 
                                                                href={`${workerUrl}/site/${subdomainInput}`} target="_blank" rel="noopener noreferrer"
                                                                className="p-2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-800/50 transition-all flex-shrink-0" 
                                                                title="Buka di Tab Baru"
                                                            >
                                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                                            </a>
                                                        </div>
                                                    </div>

                                                    <button onClick={() => { setShowPublishModal(false); setViewMode('browser'); setBrowserAddress(`${workerUrl}/site/${subdomainInput}`); }} className="w-full py-3.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-full font-bold hover:bg-gray-800 dark:hover:bg-gray-200 transition shadow-lg dark:shadow-none">Buka di Manajer Situs Internal</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* MODAL PIN KEAMANAN SEBELUM PENGATURAN */}
                        {showPinModal && (
                            <div className="fixed inset-0 bg-gray-900/40 dark:bg-gray-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[110] animate-fadeIn">
                                <div className="bg-white dark:bg-gray-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl animate-scaleIn relative text-center border border-transparent dark:border-gray-700 transition-colors">
                                    <button onClick={() => { setShowPinModal(false); setPinInput(''); }} className="absolute top-4 right-4 text-gray-400 hover:text-gray-900 dark:hover:text-white"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    <div className="w-16 h-16 bg-red-50 dark:bg-red-900/30 text-red-500 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                    </div>
                                    <h3 className="text-xl font-extrabold text-gray-900 dark:text-white mb-2">Area Terbatas</h3>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm mb-6">Masukkan PIN keamanan Admin S-Tools untuk mengakses gerbang konfigurasi.</p>
                                    
                                    <div className="space-y-4">
                                        <input 
                                            type="password" 
                                            maxLength="6"
                                            value={pinInput} 
                                            onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ''))} 
                                            onKeyDown={(e) => e.key === 'Enter' && handlePinSubmit()}
                                            className="w-full text-center text-2xl tracking-[0.5em] bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:bg-white dark:focus:bg-gray-800 focus:border-red-500 dark:focus:border-red-500 rounded-xl px-4 py-3 font-bold text-gray-900 dark:text-white outline-none transition" 
                                            placeholder="••••••"
                                        />
                                        <button onClick={handlePinSubmit} className="w-full py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full font-bold shadow-lg shadow-red-500/30 dark:shadow-none transition transform">Buka Pengaturan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL SETTINGS: SERVER CONFIG */}
                        {showSettingsModal && (
                            <div className="fixed inset-0 bg-gray-900/40 dark:bg-gray-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fadeIn">
                                <div className="bg-white dark:bg-gray-800 p-8 rounded-3xl max-w-md w-full shadow-2xl animate-scaleIn relative border border-transparent dark:border-gray-700 transition-colors">
                                    <button onClick={() => setShowSettingsModal(false)} className="absolute top-6 right-6 text-gray-400 hover:text-gray-900 dark:hover:text-white"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    <h3 className="text-2xl font-extrabold text-gray-900 dark:text-white mb-2">Konfigurasi Gateway</h3>
                                    <p className="text-gray-500 text-sm mb-6">Mengamankan jaringan Anda ke S-Tools Database Pusat.</p>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Endpoint Domain Gateway</label>
                                            <input type="text" value={workerUrl} onChange={(e) => setWorkerUrl(e.target.value)} className="mt-2 w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:bg-white dark:focus:bg-gray-800 focus:border-indigo-500 dark:focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition font-mono" />
                                        </div>
                                        <div className="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl text-xs text-gray-600 dark:text-gray-300 flex justify-between items-center border border-gray-200 dark:border-gray-700 transition-colors">
                                            <span>Status Integrasi Sistem:</span>
                                            <strong className={serverStatus === 'connected' ? 'text-green-600 dark:text-green-400 flex items-center gap-1.5' : 'text-red-600 dark:text-red-400 flex items-center gap-1.5'}>
                                                <span className={`w-2 h-2 rounded-full ${serverStatus === 'connected' ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                                {serverStatus === 'connected' ? 'Aman (Terkoneksi)' : 'Tidak Valid'}
                                            </strong>
                                        </div>
                                        <button onClick={() => { testWorkerConnection(); setShowSettingsModal(false); }} className="w-full py-3.5 bg-gray-900 dark:bg-white text-white dark:text-gray-900 hover:bg-gray-800 dark:hover:bg-gray-200 rounded-full font-bold shadow-lg dark:shadow-none transition transform">Simpan Pengaturan</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
