                                </button>

                                <h3 className="text-lg font-black text-slate-900 mb-1.5 flex items-center gap-2">
                                    🛡️ Konfigurasi Cloudflare Gateway
                                </h3>
                                <p className="text-xs text-slate-400 mb-4">Aplikasi Anda dikonfigurasi untuk memanggil Kunci API Gemini secara aman melalui gateway Cloudflare Workers pribadi Anda.</p>

                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider">URL Cloudflare Worker Aktif</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text"
                                                placeholder="https://situskilat-auth-bridge.username.workers.dev"
                                                value={workerUrl}
                                                onChange={(e) => setWorkerUrl(e.target.value)}
                                                className="flex-1 bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition duration-200 font-mono"
                                            />
                                            <button
                                                onClick={testWorkerConnection}
                                                className="px-4 py-3 bg-slate-100 border border-slate-200 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                                            >
                                                Uji Koneksi
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className={`w-2 h-2 rounded-full \${serverStatus === 'connected' ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                                            <span className="text-[10px] text-slate-500">
                                                Status Server: <span className="font-bold">{serverStatus === 'connected' ? 'Siap Merancang' : 'Terputus/Gagal'}</span>
                                            </span>
                                        </div>
                                    </div>

                                    <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs text-slate-500 leading-relaxed space-y-2">
                                        <span className="font-bold text-slate-800 block">Langkah-Langkah Singkat Pengamanan:</span>
                                        <ol className="list-decimal pl-4.5 space-y-1.5 text-[11px] text-slate-400">
                                            <li>Buat akun di platform Cloudflare Workers secara gratis.</li>
                                            <li>Salin dan pasang script otorisasi CORS & domain locking yang sudah disiapkan.</li>
                                            <li>Masukkan Kunci API Gemini Anda ke dalam menu Secrets (GEMINI_API_KEY) pada dashboard Cloudflare.</li>
                                            <li>Tempelkan tautan Worker yang Anda peroleh ke kolom di atas.</li>
                                        </ol>
                                    </div>

                                    <button 
                                        onClick={() => {
                                            testWorkerConnection();
                                            setShowSettingsModal(false);
                                        }}
                                        className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/10"
                                    >
                                        Simpan & Tutup Konfigurasi
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
