<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Tools AI Pro - AI Website Builder</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config & Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    animation: {
                        fadeIn: 'fadeIn 0.25s ease-out forwards',
                        scaleIn: 'scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        slideUp: 'slideUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(12px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles (S-Tools ID Guidelines) -->
    <style>
        body { font-family: 'Poppins', sans-serif; color: #1F2937; background-color: #F9FAFB; }
        
        .text-gradient {
            background-image: linear-gradient(90deg, #4F46E5, #3B82F6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; text-fill-color: transparent;
        }

        .reveal {
            opacity: 0; transform: translateY(15px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dark-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .dark-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="overflow-hidden h-screen w-full">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CLOUDFLARE_WORKER_URL = "https://web-builder-stools.senrima-ms.workers.dev";

        const TEMPLATES = {
            saas: `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaSaaS - Masa Depan Kerja Tim</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 min-h-screen">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 px-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <span class="text-xl font-extrabold text-indigo-600">LuminaSaaS</span>
            <nav class="hidden md:flex gap-6 text-sm font-semibold text-gray-500">
                <a href="#" class="hover:text-indigo-600">Fitur</a>
                <a href="#" class="hover:text-indigo-600">Harga</a>
            </nav>
            <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-gray-800 transition">Mulai Gratis</button>
        </div>
    </header>
    <section class="py-24 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-gray-900">Sinkronisasi Tim <span class="text-indigo-600">Tanpa Batas</span></h1>
        <p class="text-lg text-gray-500 mb-10">Tingkatkan produktivitas perusahaan dengan platform kolaborasi dan analitik paling intuitif di dunia.</p>
        <button class="bg-indigo-600 text-white px-8 py-4 rounded-full font-bold shadow-lg shadow-indigo-600/30 hover:scale-105 transition transform">Jadwalkan Demo</button>
    </section>
</body>
</html>`,
            coffee: `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Wangi - Seduhan Estetik</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>h1, h2 { font-family: 'Playfair Display', serif; } body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-stone-50 text-stone-800">
    <nav class="p-6 max-w-5xl mx-auto flex justify-between items-center">
        <span class="text-2xl font-extrabold text-stone-900 tracking-widest">KOPI WANGI</span>
        <button class="border border-stone-800 text-stone-800 px-6 py-2 text-sm font-bold uppercase tracking-widest hover:bg-stone-800 hover:text-white transition">Menu</button>
    </nav>
    <section class="py-20 px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 text-stone-900">Ketenangan di Setiap<br><span class="italic font-light text-stone-500">Tetesan Seduhan</span></h1>
        <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=800&q=80" class="mx-auto rounded-2xl shadow-2xl mt-12 w-full max-w-3xl object-cover h-[400px]">
    </section>
</body>
</html>`
        };

        function App() {
            const [viewMode, setViewMode] = useState('editor'); 
            const [editorTab, setEditorTab] = useState('preview'); 
            const [previewMode, setPreviewMode] = useState('desktop'); 
            
            const [prompt, setPrompt] = useState('');
            const [generatedCode, setGeneratedCode] = useState(TEMPLATES.saas);
            const [isLoading, setIsLoading] = useState(false);

            const [workerUrl, setWorkerUrl] = useState(() => {
                let saved = localStorage.getItem('situs_kilat_worker_url');
                if (!saved || saved.includes('nama-anda') || saved.includes('username')) {
                    saved = CLOUDFLARE_WORKER_URL;
                }
                if (saved.endsWith('/')) saved = saved.slice(0, -1);
                return saved;
            });
            const [serverStatus, setServerStatus] = useState('idle');

            const [history, setHistory] = useState([TEMPLATES.saas]);
            const [historyIndex, setHistoryIndex] = useState(0);

            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            const [subdomainInput, setSubdomainInput] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);
            const [publishStep, setPublishStep] = useState(0);
            const [terminalLogs, setTerminalLogs] = useState([]);
            const [publishedSites, setPublishedSites] = useState([]);
            const [browserAddress, setBrowserAddress] = useState('');

            // Efek Render Visual (Reveal)
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('active');
                    });
                }, { threshold: 0.1 });

                const revealElements = document.querySelectorAll('.reveal');
                revealElements.forEach(el => observer.observe(el));

                return () => revealElements.forEach(el => observer.unobserve(el));
            }, [viewMode, editorTab]);

            // Inisialisasi awal
            useEffect(() => {
                let formattedUrl = workerUrl;
                if (formattedUrl.endsWith('/')) formattedUrl = formattedUrl.slice(0, -1);
                localStorage.setItem('situs_kilat_worker_url', formattedUrl);
            }, [workerUrl]);

            useEffect(() => {
                const savedSites = localStorage.getItem('situs_kilat_published_sites');
                if (savedSites) setPublishedSites(JSON.parse(savedSites));
                testWorkerConnection();
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
            };

            const testWorkerConnection = async () => {
                setServerStatus('fetching');
                try {
                    const url = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                    const response = await fetch(`${url}/auth`, { method: "GET" });
                    setServerStatus(response.ok ? 'connected' : 'failed');
                } catch (e) {
                    setServerStatus('failed');
                }
            };

            const fetchApiKeyFromWorker = async () => {
                try {
                    const url = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                    const response = await fetch(`${url}/auth`, { method: "GET" });
                    if (!response.ok) throw new Error(`Worker HTTP error: ${response.status}`);
                    const data = await response.json();
                    if (data && data.success && data.apiKey) {
                        setServerStatus('connected');
                        return data.apiKey;
                    }
                    throw new Error(data.error || "Skema respon JSON salah dari server.");
                } catch (err) {
                    setServerStatus('failed');
                    throw new Error(`Gagal menarik kunci API: ${err.message}`);
                }
            };

            const updateCodeWithHistory = (newCode) => {
                const updatedHistory = history.slice(0, historyIndex + 1);
                updatedHistory.push(newCode);
                setHistory(updatedHistory);
                setHistoryIndex(updatedHistory.length - 1);
                setGeneratedCode(newCode);
            };

            const handleUndo = () => {
                if (historyIndex > 0) {
                    setHistoryIndex(historyIndex - 1);
                    setGeneratedCode(history[historyIndex - 1]);
                }
            };

            const handleRedo = () => {
                if (historyIndex < history.length - 1) {
                    setHistoryIndex(historyIndex + 1);
                    setGeneratedCode(history[historyIndex + 1]);
                }
            };

            // Custom Fetch dengan Penanganan Error Instan untuk 400/403/404
            const fetchWithBackoff = async (url, options, retries = 2, delay = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        const errMsg = errData.error?.message || `HTTP ${response.status}`;
                        // Langsung lemparkan error tanpa menunggu retry jika masalahnya fatal
                        if (response.status >= 400 && response.status < 500) throw new Error(`[${response.status}] ${errMsg}`);
                        throw new Error(errMsg);
                    }
                    return await response.json();
                } catch (error) {
                    if (retries === 0 || error.message.includes('[40') || error.message.includes('API key') || error.message.includes('not found')) {
                        throw error;
                    }
                    console.warn(`Mencoba ulang koneksi ke Google... (${retries} sisa)`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithBackoff(url, options, retries - 1, delay * 2);
                }
            };

            // ==========================================
            // PROSES AI GENERATION
            // ==========================================
            const handleAiGeneration = async (isEdit = false) => {
                if (!prompt.trim()) return showToast('Masukkan instruksi web Anda!', 'error');

                setIsLoading(true);
                setViewMode('editor');
                setEditorTab('preview'); 

                let secureApiKey = "";
                try {
                    secureApiKey = await fetchApiKeyFromWorker();
                    secureApiKey = secureApiKey.trim(); // Pastikan tidak ada spasi/enter tersembunyi yang merusak URL API
                } catch (err) {
                    setIsLoading(false);
                    showToast(err.message, "error");
                    setShowSettingsModal(true);
                    return;
                }

                const systemPrompt = isEdit
                    ? `Anda adalah AI perancang web ahli. Modifikasi kode HTML sesuai instruksi. Berikan HANYA kode HTML mentah yang utuh tanpa bungkus markdown. Pastikan script atau css cdn tetap utuh.`
                    : `Anda adalah AI pembuat website (Single Page) ahli menggunakan Tailwind CSS. 
                      Keluarkan HANYA kode HTML5 mandiri yang utuh tanpa penjelasan atau markdown. Desain wajib mewah, gunakan font "Poppins", dan aset gambar berkualitas tinggi dari Unsplash.`;

                const userPromptText = isEdit
                    ? `KODE SAAT INI:\n${generatedCode}\n\nINSTRUKSI REVISI:\n${prompt}\nBerikan seluruh HTML secara lengkap.`
                    : prompt;

                // DAFTAR MODEL FALLBACK: Mesin akan mencari otomatis model yang diizinkan oleh API Key Anda
                const modelsToTry = [
                    'gemini-2.5-flash',
                    'gemini-2.5-flash-preview-09-2025',
                    'gemini-2.0-flash',
                    'gemini-1.5-flash',
                    'gemini-1.5-pro',
                    'gemini-1.5-flash-8b',
                    'gemini-1.5-flash-001',
                    'gemini-1.5-flash-002'
                ];

                let responseData = null;
                let lastErrorMsg = "";

                try {
                    for (const modelName of modelsToTry) {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${secureApiKey}`;
                        
                        try {
                            // Menggunakan fungsi fetchWithBackoff yang sudah ada untuk retry jika koneksi terputus
                            const data = await fetchWithBackoff(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: userPromptText }] }],
                                    systemInstruction: { parts: [{ text: systemPrompt }] }
                                })
                            });

                            // Jika berhasil, simpan data dan keluar dari loop pencarian
                            responseData = data;
                            console.log(`✅ Berhasil menggunakan model: ${modelName}`);
                            break; 
                        } catch (err) {
                            lastErrorMsg = err.message;
                            // Jika error 404 (Model tidak ada), lanjut ke model berikutnya di array
                            if (lastErrorMsg.includes('404') || lastErrorMsg.includes('not found')) {
                                console.warn(`Model ${modelName} ditolak Google (404). Lanjut ke model berikutnya...`);
                                continue;
                            }
                            // Jika error lain (seperti 400 Kunci Salah atau kuota habis), langsung lempar error fatal
                            throw err;
                        }
                    }

                    // Jika setelah loop semua model tetap gagal ditemukan
                    if (!responseData) {
                        throw new Error(`Semua versi model AI tidak tersedia atau ditolak oleh Google. Coba periksa Kunci API Anda. Error: ${lastErrorMsg}`);
                    }

                    let rawHtml = responseData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawHtml) throw new Error('Respons AI kosong atau diblokir filter keamanan Google.');

                    let cleanedCode = rawHtml.trim();
                    if (cleanedCode.includes('```html')) cleanedCode = cleanedCode.split('```html')[1].split('```')[0];
                    else if (cleanedCode.includes('```')) cleanedCode = cleanedCode.split('```')[1].split('```')[0];
                    
                    updateCodeWithHistory(cleanedCode.trim());
                    setPrompt('');
                    showToast('Desain selesai dirakit!', 'success');
                } catch (error) {
                    // Tampilkan pesan error ASLI dari Google agar penyebabnya jelas
                    showToast(`GAGAL: ${error.message}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            // ==========================================
            // PUBLISH KE CLOUDFLARE KV 
            // ==========================================
            const executePublishFlow = async () => {
                if (!subdomainInput.trim()) return showToast('Ketikkan nama domain proyek!', 'error');
                const cleanSubdomain = subdomainInput.toLowerCase().replace(/[^a-z0-9-]/g, '');
                
                setIsPublishing(true);
                setPublishStep(1);
                setTerminalLogs([]);

                const logIt = (text, delay) => new Promise(r => setTimeout(() => {
                    setTerminalLogs(prev => [...prev, `> ${text}`]);
                    r();
                }, delay));

                try {
                    await logIt('Mempersiapkan jalur DNS aman...', 0);
                    await logIt('Menyiapkan transfer data...', 600);

                    const url = workerUrl.endsWith('/') ? workerUrl.slice(0, -1) : workerUrl;
                    
                    const response = await fetch(`${url}/publish`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            subdomain: cleanSubdomain,
                            html: generatedCode
                        })
                    });

                    setPublishStep(2);
                    await logIt('Mengunggah berkas HTML ke Cloudflare KV...', 500);

                    const result = await response.json();

                    if (result.success) {
                        setPublishStep(3);
                        await logIt('Menerbitkan sertifikat keamanan SSL...', 500);
                        
                        setPublishStep(4);
                        
                        const newSites = [{
                            subdomain: cleanSubdomain,
                            liveUrl: result.url,
                            code: generatedCode,
                            title: generatedCode.match(/<title>([^<]*)<\/title>/i)?.[1] || 'Situs Kilat'
                        }, ...publishedSites.filter(s => s.subdomain !== cleanSubdomain)];
                        
                        setPublishedSites(newSites);
                        localStorage.setItem('situs_kilat_published_sites', JSON.stringify(newSites));
                        showToast('Website Anda resmi Live!', 'success');
                    } else {
                        throw new Error(result.error);
                    }
                } catch (error) {
                    console.error(error);
                    showToast('Gagal mempublikasikan situs: ' + error.message, 'error');
                    setPublishStep(0);
                } finally {
                    setIsPublishing(false);
                }
            };

            // TAMPILAN BLOKIR UNTUK MOBILE
            const MobileBlocker = () => (
                <div className="flex lg:hidden fixed inset-0 z-[9999] bg-white flex-col items-center justify-center p-8 text-center">
                    <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-6">
                        <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <h1 className="text-2xl font-extrabold text-gray-900 mb-3">Mohon Buka di Desktop</h1>
                    <p className="text-gray-500 text-sm leading-relaxed max-w-sm">
                        Lingkungan perancangan web ini memerlukan layar lebar. Silakan akses tautan ini melalui komputer atau laptop Anda.
                    </p>
                </div>
            );

            // Ekstrak hostname dari worker URL untuk UI
            const getWorkerDomain = () => {
                try { return new URL(workerUrl).hostname; } catch (e) { return "domain-anda.com"; }
            };

            return (
                <React.Fragment>
                    <MobileBlocker />
                    
                    {/* Aplikasi Utama (Desktop Only) */}
                    <div className="hidden lg:flex flex-col h-screen w-full bg-gray-50 overflow-hidden font-sans">
                        
                        {/* Notifikasi Toast */}
                        {toast.show && (
                            <div className={`fixed top-6 right-6 z-[999] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all border text-sm animate-fadeIn \${
                                toast.type === 'success' ? 'bg-white border-green-100 text-green-700' :
                                toast.type === 'error' ? 'bg-white border-red-100 text-red-700' : 'bg-white border-indigo-100 text-indigo-700'
                            }`}>
                                <p className="font-semibold">{toast.message}</p>
                            </div>
                        )}

                        {/* Top Header Menempel */}
                        <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-lg border-b border-gray-200 flex items-center justify-between px-6 py-4 shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <div>
                                    <span className="text-lg font-extrabold tracking-tight text-gray-900">
                                        SitusKilat <span className="text-gradient">AI Pro</span>
                                    </span>
                                </div>
                            </div>

                            {/* View Switcher */}
                            <div className="flex items-center bg-gray-100 p-1.5 rounded-xl border border-gray-200">
                                <button 
                                    onClick={() => setViewMode('editor')}
                                    className={`px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition-all duration-200 \${viewMode === 'editor' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    Ruang Kerja
                                </button>
                                <button 
                                    onClick={() => {
                                        if (publishedSites.length === 0) return showToast('Terbitkan website terlebih dahulu!', 'info');
                                        setViewMode('browser');
                                        setBrowserAddress(publishedSites[0].liveUrl);
                                    }}
                                    className={`px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition-all duration-200 \${viewMode === 'browser' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                                    Website Live
                                </button>
                            </div>

                            <div className="flex items-center gap-3">
                                <button onClick={() => setShowSettingsModal(true)} className="p-2.5 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 rounded-xl transition" title="Pengaturan Server Worker">

                                <div className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl animate-scaleIn relative">
                                    <button onClick={() => setShowSettingsModal(false)} className="absolute top-6 right-6 text-gray-400 hover:text-gray-900"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    <h3 className="text-2xl font-extrabold text-gray-900 mb-2">Konfigurasi Gateway</h3>
                                    <p className="text-gray-500 text-sm mb-6">Mengamankan kunci API Anda ke server Cloudflare.</p>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase tracking-wide">Endpoint Worker URL</label>
                                            <input type="text" value={workerUrl} onChange={(e) => setWorkerUrl(e.target.value)} className="mt-2 w-full bg-gray-50 border border-gray-200 focus:bg-white focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none transition font-mono" />
                                        </div>
                                        <div className="p-4 bg-gray-50 rounded-xl text-xs text-gray-600 flex justify-between items-center border border-gray-200">
                                            <span>Status Server:</span>
                                            <strong className={serverStatus === 'connected' ? 'text-green-600 flex items-center gap-1.5' : 'text-red-600 flex items-center gap-1.5'}>
                                                <span className={`w-2 h-2 rounded-full ${serverStatus === 'connected' ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                                {serverStatus === 'connected' ? 'Terkoneksi' : 'Gagal Konek'}
                                            </strong>
                                        </div>
                                        <button onClick={() => { testWorkerConnection(); setShowSettingsModal(false); }} className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-blue-500 text-white rounded-full font-bold shadow-lg shadow-blue-500/30 hover:scale-105 transition transform">Simpan Pengaturan</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
