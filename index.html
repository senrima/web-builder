<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Tools AI Pro - AI Website Builder</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Config & Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    animation: {
                        fadeIn: 'fadeIn 0.25s ease-out forwards',
                        scaleIn: 'scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        slideUp: 'slideUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(12px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body { font-family: 'Poppins', sans-serif; color: #1F2937; background-color: #F9FAFB; }
        
        .text-gradient {
            background-image: linear-gradient(90deg, #4F46E5, #3B82F6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; text-fill-color: transparent;
        }

        .reveal {
            opacity: 0; transform: translateY(15px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .section-bg-glow {
            position: relative;
            overflow: hidden;
        }
        .section-bg-glow::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, rgba(59, 130, 246, 0.03) 40%, transparent 70%);
            opacity: 0; transition: opacity 2s ease-in-out; pointer-events: none; z-index: 0;
        }
        .section-bg-glow.glow-active::after { opacity: 1; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dark-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .dark-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="overflow-hidden h-screen w-full">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🛡️ DOMAIN UTAMA S-TOOLS ID
        // ==========================================
        const DEFAULT_WORKER_URL = "https://web.s-tools.id";
        
        // HASH PIN KEAMANAN (Base64 dari PIN untuk Obfuscation Code agar tidak mudah dicari)
        const SECURE_PIN_HASH = "MjM2OTk5"; 

        const TEMPLATES = {
            saas: `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaSaaS - Masa Depan Kerja Tim</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 min-h-screen">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 px-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <span class="text-xl font-extrabold text-indigo-600">LuminaSaaS</span>
            <nav class="hidden md:flex gap-6 text-sm font-semibold text-gray-500">
                <a href="#" class="hover:text-indigo-600">Fitur</a>
                <a href="#" class="hover:text-indigo-600">Harga</a>
            </nav>
            <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-gray-800 transition">Mulai Gratis</button>
        </div>
    </header>
    <section class="py-24 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-gray-900">Sinkronisasi Tim <span class="text-indigo-600">Tanpa Batas</span></h1>
        <p class="text-lg text-gray-500 mb-10">Tingkatkan produktivitas perusahaan dengan platform kolaborasi dan analitik paling intuitif di dunia.</p>
        <button class="bg-indigo-600 text-white px-8 py-4 rounded-full font-bold shadow-lg shadow-indigo-600/30 hover:scale-105 transition transform">Jadwalkan Demo</button>
    </section>
</body>
</html>`,
            coffee: `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Wangi - Seduhan Estetik</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>h1, h2 { font-family: 'Playfair Display', serif; } body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-stone-50 text-stone-800">
    <nav class="p-6 max-w-5xl mx-auto flex justify-between items-center">
        <span class="text-2xl font-extrabold text-stone-900 tracking-widest">KOPI WANGI</span>
        <button class="border border-stone-800 text-stone-800 px-6 py-2 text-sm font-bold uppercase tracking-widest hover:bg-stone-800 hover:text-white transition">Menu</button>
    </nav>
    <section class="py-20 px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 text-stone-900">Ketenangan di Setiap<br><span class="italic font-light text-stone-500">Tetesan Seduhan</span></h1>
        <img src="https://picsum.photos/800/400?random=1" class="mx-auto rounded-2xl shadow-2xl mt-12 w-full max-w-3xl object-cover h-[400px]">
    </section>
</body>
</html>`
        };

        function App() {
            // States
            const [viewMode, setViewMode] = useState('editor'); 
            const [editorTab, setEditorTab] = useState('preview'); 
            const [previewMode, setPreviewMode] = useState('desktop'); 
            const [isFullscreen, setIsFullscreen] = useState(false); // Fitur Fullscreen
            const [sidebarOpen, setSidebarOpen] = useState(true);
            
            const [prompt, setPrompt] = useState('');
            const [generatedCode, setGeneratedCode] = useState(TEMPLATES.saas);
            const [isLoading, setIsLoading] = useState(false);

            const [workerUrl, setWorkerUrl] = useState(() => {
                let saved = localStorage.getItem('situs_kilat_worker_url');
                if (!saved || saved.includes('workers.dev') || saved.includes('nama-anda')) saved = DEFAULT_WORKER_URL;
                if (saved.endsWith('/')) saved = saved.slice(0, -1);
                return saved;
            });
            const [serverStatus, setServerStatus] = useState('idle');

            const [history, setHistory] = useState([TEMPLATES.saas]);
            const [historyIndex, setHistoryIndex] = useState(0);

            const [showPinModal, setShowPinModal] = useState(false); // Modal PIN Pengaturan
            const [pinInput, setPinInput] = useState('');
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showPublishModal, setShowPublishModal] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            const [subdomainInput, setSubdomainInput] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);
            const [publishStep, setPublishStep] = useState(0);
            const [publishedSites, setPublishedSites] = useState([]);
            const [browserAddress, setBrowserAddress] = useState('');

            // Efek Animasi UI Dinamis
            useEffect(() => {
                const timer = setTimeout(() => {
                    const glowElements = document.querySelectorAll('.section-bg-glow');
                    glowElements.forEach(el => el.classList.add('glow-active'));
                }, 150);

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('active');
                    });
                }, { threshold: 0.1 });

                const revealElements = document.querySelectorAll('.reveal');
                revealElements.forEach(el => observer.observe(el));

                return () => {
                    clearTimeout(timer);
                    revealElements.forEach(el => observer.unobserve(el));
                };
            }, [viewMode, editorTab, isFullscreen]);

            useEffect(() => {
                let formattedUrl = workerUrl;
                if (formattedUrl.endsWith('/')) formattedUrl = formattedUrl.slice(0, -1);
                localStorage.setItem('situs_kilat_worker_url', formattedUrl);
            }, [workerUrl]);

            useEffect(() => {
                const savedSites = localStorage.getItem('situs_kilat_published_sites');
                if (savedSites) setPublishedSites(JSON.parse(savedSites));
                testWorkerConnection();
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
            };

            // VERIFIKASI PIN PENGATURAN
            const handlePinSubmit = () => {
                // btoa(pinInput) mengkonversi teks ke Base64 untuk dicocokkan dengan SECURE_PIN_HASH
                if (btoa(pinInput) === SECURE_PIN_HASH) {
                    setShowPinModal(false);
                    setPinInput('');
                    setShowSettingsModal(true);
                } else {
                    showToast('Kode PIN tidak valid!', 'error');
                    setPinInput('');
                }
            };

            const testWorkerConnection = async () => {
                setServerStatus('fetching');
                try {
                    const response = await fetch(`${workerUrl}/auth`, { method: "GET" });
                    setServerStatus(response.ok ? 'connected' : 'failed');
                } catch (e) {
                    setServerStatus('failed');
                }
            };

            const fetchApiKeyFromWorker = async () => {
                try {
                    const response = await fetch(`${workerUrl}/auth`, { method: "GET" });
                    if (!response.ok) throw new Error(`Gateway HTTP error: ${response.status}`);
                    const data = await response.json();
                    if (data && data.success && data.apiKey) {
                        setServerStatus('connected');
                        return data.apiKey;
                    }
                    throw new Error(data.error || "Skema respon JSON salah dari server S-Tools.");
                } catch (err) {
                    setServerStatus('failed');
                    throw new Error(`Gagal menarik kunci API: ${err.message}`);
                }
            };

            const updateCodeWithHistory = (newCode) => {
                const updatedHistory = history.slice(0, historyIndex + 1);
                updatedHistory.push(newCode);
                setHistory(updatedHistory);
                setHistoryIndex(updatedHistory.length - 1);
                setGeneratedCode(newCode);
            };

            const handleUndo = () => {
                if (historyIndex > 0) {
                    setHistoryIndex(historyIndex - 1);
                    setGeneratedCode(history[historyIndex - 1]);
                }
            };

            const handleRedo = () => {
                if (historyIndex < history.length - 1) {
                    setHistoryIndex(historyIndex + 1);
                    setGeneratedCode(history[historyIndex + 1]);
                }
            };

            // Menarik Situs yang sudah tayang kembali ke Editor
            const handleEditLiveSite = () => {
                const site = publishedSites.find(s => s.liveUrl === browserAddress);
                if (site) {
                    updateCodeWithHistory(site.code);
                    setViewMode('editor');
                    setEditorTab('preview');
                    setPrompt(`Tolong tingkatkan desain bagian...`); // Placeholder text
                    showToast(`Situs ${site.subdomain} berhasil ditarik ke Ruang Kerja siap diedit.`, 'success');
                }
            };

            const fetchWithBackoff = async (url, options, retries = 2, delay = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        const errMsg = errData.error?.message || `HTTP ${response.status}`;
                        if (response.status >= 400 && response.status < 500) throw new Error(`[${response.status}] ${errMsg}`);
                        throw new Error(errMsg);
                    }
                    return await response.json();
                } catch (error) {
                    if (retries === 0 || error.message.includes('[40') || error.message.includes('API key') || error.message.includes('not found')) {
                        throw error;
                    }
                    console.warn(`Mencoba ulang koneksi ke Google... (${retries} sisa)`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithBackoff(url, options, retries - 1, delay * 2);
                }
            };

            // ==========================================
            // PROSES GENERATE AI
            // ==========================================
            const handleAiGeneration = async (isEdit = false) => {
                if (!prompt.trim()) return showToast('Masukkan instruksi web Anda!', 'error');

                setIsLoading(true);
                setViewMode('editor');
                setEditorTab('preview'); 

                let secureApiKey = "";
                try {
                    secureApiKey = await fetchApiKeyFromWorker();
                    secureApiKey = secureApiKey.trim();
                } catch (err) {
                    setIsLoading(false);
                    showToast(err.message, "error");
                    return;
                }

                const systemPrompt = isEdit
                    ? `Anda adalah Senior Web Developer & UI/UX Designer profesional dengan 20 tahun pengalaman. Lakukan modifikasi kode HTML dengan kreativitas tingkat tinggi, presisi pixel-perfect, dan standar industri modern. Berikan HANYA kode HTML mentah yang utuh tanpa bungkus markdown. Pastikan fungsionalitas, script, dan CSS CDN tetap utuh. JANGAN gunakan source.unsplash.com, gunakan picsum.photos.`
                    : `Anda adalah Senior Web Developer, UI/UX Expert, dan Art Director profesional dengan lebih dari 20 tahun pengalaman dalam merancang website kelas dunia. Anda sangat kreatif, inovatif, dan sangat memperhatikan detail estetika. Buatlah website (Single Page) yang mewah, elegan, dan modern menggunakan Tailwind CSS. 
                      ATURAN WAJIB:
                      1. Keluarkan HANYA kode HTML5 mandiri yang utuh tanpa penjelasan, tanpa komentar, dan tanpa bungkus markdown.
                      2. Desain harus memiliki hierarki visual sempurna, whitespace yang lega, dan animasi transisi/hover yang halus.
                      3. SELALU sertakan tag <meta name="viewport" content="width=device-width, initial-scale=1.0"> agar 100% responsif di mobile/tablet/desktop.
                      4. WAJIB GUNAKAN GAMBAR AGAR WEB TERLIHAT HIDUP. Karena source.unsplash.com sudah mati, Anda WAJIB menggunakan layanan gambar 'https://picsum.photos' (contoh: https://picsum.photos/1200/800?random=1) atau menggunakan 'https://images.unsplash.com/photo-[id]'.
                      5. Gunakan font "Poppins" dari Google Fonts.
                      Buktikan pengalaman 20 tahun Anda melalui kualitas struktur kode yang rapi dan hasil seni desain web yang luar biasa.`;

                const userPromptText = isEdit
                    ? `KODE SAAT INI:\n${generatedCode}\n\nINSTRUKSI REVISI:\n${prompt}\nBerikan seluruh HTML secara lengkap.`
                    : prompt;

                const modelsToTry = [
                    'gemini-2.5-flash',
                    'gemini-1.5-flash',
                    'gemini-1.5-pro'
                ];

                let responseData = null;
                let lastErrorMsg = "";

                try {
                    for (const modelName of modelsToTry) {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${secureApiKey}`;
                        
                        try {
                            const data = await fetchWithBackoff(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: userPromptText }] }],
                                    systemInstruction: { parts: [{ text: systemPrompt }] }
                                })
                            });
                            responseData = data;
                            break; 
                        } catch (err) {
                            lastErrorMsg = err.message;
                            if (lastErrorMsg.includes('404') || lastErrorMsg.includes('not found')) continue;
                            throw err;
                        }
                    }

                    if (!responseData) throw new Error(`Semua versi model AI tidak tersedia. Error: ${lastErrorMsg}`);

                    let rawHtml = responseData.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawHtml) throw new Error('Respons AI kosong atau diblokir filter keamanan.');

                    let cleanedCode = rawHtml.trim();
                    if (cleanedCode.includes('```html')) cleanedCode = cleanedCode.split('```html')[1].split('```')[0];
                    else if (cleanedCode.includes('```')) cleanedCode = cleanedCode.split('```')[1].split('```')[0];
                    
                    updateCodeWithHistory(cleanedCode.trim());
                    setPrompt('');
                    showToast('Desain selesai dirakit dengan sukses!', 'success');
                } catch (error) {
                    let userFriendlyError = error.message;
                    if (error.message.includes('400')) userFriendlyError = "API Key tidak valid atau permintaan ditolak.";
                    if (error.message.includes('403')) userFriendlyError = "Akses terlarang ke Google API. Coba ganti kunci Anda.";
                    showToast(`GAGAL: ${userFriendlyError}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            // ==========================================
            // PUBLISH KE S-TOOLS DATABASE (WEB.S-TOOLS.ID)
            // ==========================================
            const executePublishFlow = async () => {
                if (!subdomainInput.trim()) return showToast('Ketikkan nama domain proyek!', 'error');
                const cleanSubdomain = subdomainInput.toLowerCase().replace(/[^a-z0-9-]/g, '');
                
                setIsPublishing(true);
                setPublishStep(1);

                try {
                    const response = await fetch(`${workerUrl}/publish`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            subdomain: cleanSubdomain,
                            html: generatedCode
                        })
                    });

                    setPublishStep(2);

                    const result = await response.json();

                    if (result.success) {
                        setPublishStep(4);
                        
                        const newSites = [{
                            subdomain: cleanSubdomain,
                            liveUrl: result.url,
                            code: generatedCode,
                            title: generatedCode.match(/<title>([^<]*)<\/title>/i)?.[1] || 'Situs Kilat'
                        }, ...publishedSites.filter(s => s.subdomain !== cleanSubdomain)];
                        
                        setPublishedSites(newSites);
                        localStorage.setItem('situs_kilat_published_sites', JSON.stringify(newSites));
                        showToast('Website Anda resmi Live!', 'success');
                    } else {
                        throw new Error(result.error);
                    }
                } catch (error) {
                    console.error(error);
                    showToast('Gagal mempublikasikan situs: ' + error.message, 'error');
                    setPublishStep(0);
                } finally {
                    setIsPublishing(false);
                }
            };

            const handleDeleteSite = (subdomain, e) => {
                e.stopPropagation();
                const filtered = publishedSites.filter(site => site.subdomain !== subdomain);
                setPublishedSites(filtered);
                localStorage.setItem('situs_kilat_published_sites', JSON.stringify(filtered));
                showToast(`Situs ${subdomain} dihapus dari manajer.`, 'info');
            };

            // BLOKIR AKSES MOBILE
            const MobileBlocker = () => (
                <div className="flex lg:hidden fixed inset-0 z-[9999] bg-white flex-col items-center justify-center p-8 text-center">
                    <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-6">
                        <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <h1 className="text-2xl font-extrabold text-gray-900 mb-3">Mohon Buka di Desktop</h1>
                    <p className="text-gray-500 text-sm leading-relaxed max-w-sm">
                        Lingkungan perancangan web ini memerlukan layar lebar. Silakan akses tautan ini melalui komputer atau laptop Anda.
                    </p>
                </div>
            );

            return (
                <React.Fragment>
                    <MobileBlocker />
                    
                    {/* LAYAR PENUH (FULLSCREEN PREVIEW) */}
                    {isFullscreen && (
                        <div className="fixed inset-0 z-[9999] bg-white flex flex-col animate-fadeIn">
                            <div className="bg-gray-900 px-5 py-3 flex justify-between items-center text-white shadow-xl">
                                <div className="flex items-center gap-2">
                                    <div className="flex gap-1.5 mr-3">
                                        <span className="w-3 h-3 rounded-full bg-red-500"></span>
                                        <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                                        <span className="w-3 h-3 rounded-full bg-green-500"></span>
                                    </div>
                                    <span className="font-semibold text-sm tracking-wide">Pratinjau Layar Penuh</span>
                                </div>
                                <button onClick={() => setIsFullscreen(false)} className="px-5 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-bold transition-all shadow-sm flex items-center gap-2">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    Keluar Tampilan
                                </button>
                            </div>
                            <iframe srcDoc={generatedCode} className="w-full flex-1 border-none bg-white" sandbox="allow-scripts allow-same-origin"/>
                        </div>
                    )}

                    <div className="hidden lg:flex flex-col h-screen w-full bg-gray-50 overflow-hidden font-sans">
                        
                        {/* Notifikasi Toast */}
                        {toast.show && (
                            <div className={`fixed top-6 right-6 z-[999] flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all border text-sm animate-fadeIn \${
                                toast.type === 'success' ? 'bg-white border-green-100 text-green-700' :
                                toast.type === 'error' ? 'bg-white border-red-100 text-red-700' : 'bg-white border-indigo-100 text-indigo-700'
                            }`}>
                                <p className="font-semibold">{toast.message}</p>
                            </div>
                        )}

                        {/* Top Header */}
                        <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-lg border-b border-gray-200 flex items-center justify-between px-6 py-4 shadow-sm">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 text-gray-600 hover:text-indigo-600 hover:bg-gray-100 rounded-xl transition-all duration-200">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                                </button>
                                <div className="flex items-center gap-2">
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    </div>
                                    <div>
                                        <span className="text-lg font-extrabold tracking-tight text-gray-900">
                                            S-Tools <span className="text-gradient font-black">AI Pro</span>
                                        </span>
                                    </div>

                                            </div>

                                            {/* Tombol Salin & Buka External */}
                                            {browserAddress && (
                                                <div className="flex items-center gap-1.5 pl-2 border-l border-gray-200 ml-2">
                                                    <button onClick={() => { navigator.clipboard.writeText(browserAddress); showToast('Tautan disalin ke papan klip!'); }} className="p-1.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition" title="Salin Tautan">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                                    </button>
                                                    <a href={browserAddress} target="_blank" rel="noopener noreferrer" className="p-1.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition" title="Buka di Tab Baru">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                                    </a>
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="flex items-center gap-2 flex-shrink-0">
                                            {/* Fitur EDIT SITUS LIVE YANG BARU DITAMBAHKAN */}
                                            <button onClick={handleEditLiveSite} className="px-4 py-1.5 text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition border border-indigo-100 shadow-sm flex items-center gap-1.5">
                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                                Edit Situs Ini
                                            </button>

                                            <button onClick={() => {
                                                const site = publishedSites.find(s => s.liveUrl === browserAddress);
                                                if (site) {
                                                    handleDeleteSite(site.subdomain, { stopPropagation: () => {} });
                                                    if (publishedSites.length > 1) {
                                                        setBrowserAddress(publishedSites.filter(s => s.subdomain !== site.subdomain)[0].liveUrl);
                                                    } else {
                                                        setViewMode('editor');
                                                    }
                                                }
                                            }} className="px-3 py-1.5 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition border border-red-100">
                                                Hapus
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex-1 bg-white relative">
                                        {browserAddress ? (
                                            <iframe src={browserAddress} className="w-full h-full border-none" />
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-full text-gray-400">Pilih situs dari daftar dropdown di atas.</div>
                                        )}
                                    </div>
                                </main>
                            )}
                        </div>

                        {/* MODAL GO LIVE: TERHUBUNG KE S-TOOLS DATABASE */}
                        {showPublishModal && (
                            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fadeIn">
                                <div className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl animate-scaleIn">
                                    <h3 className="text-2xl font-extrabold text-gray-900 mb-2">Terbitkan Website</h3>
                                    <p className="text-gray-500 text-sm mb-6">Miliki link kustom instan di jaringan S-Tools Edge Server.</p>

                                    {publishStep === 0 ? (
                                        <div className="space-y-5">
                                            <div className="space-y-2">
                                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider">Tentukan Nama Proyek Anda</label>
                                                <div className="flex items-center bg-gray-50 border border-gray-200 focus-within:border-indigo-500 focus-within:bg-white rounded-xl px-4 py-3.5 transition duration-200">
                                                    <input 
                                                        type="text" 
                                                        placeholder="contoh: portofolio-keren" 
                                                        value={subdomainInput} 
                                                        onChange={(e) => setSubdomainInput(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ''))} 
                                                        className="bg-transparent outline-none flex-1 font-bold text-gray-900 w-full"
                                                    />
                                                </div>
                                                
                                                {/* PRATINJAU LINK */}
                                                <div className="mt-2 p-3 bg-indigo-50/50 border border-indigo-100 rounded-lg">
                                                    <span className="text-[10px] text-gray-500 block mb-1">Pratinjau Tautan Publik Anda:</span>
                                                    <span className="text-xs font-mono font-bold text-indigo-700 break-all">
                                                        {workerUrl}/site/{subdomainInput || 'nama-proyek'}
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="flex gap-3 pt-2">
                                                <button onClick={() => setShowPublishModal(false)} className="flex-1 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full font-bold transition">Batal</button>
                                                <button onClick={executePublishFlow} className="flex-1 py-3.5 bg-gradient-to-r from-indigo-600 to-blue-500 text-white hover:scale-105 rounded-full font-bold transition transform shadow-lg shadow-blue-500/30">Publikasi Sekarang</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-6">
                                            {publishStep < 4 ? (
                                                <div className="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
                                            ) : (
                                                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6"><svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"/></svg></div>
                                            )}
                                            
                                            <h4 className="font-bold text-gray-900 text-lg mb-2">{publishStep < 4 ? 'Mengunggah ke Database Pusat...' : 'Website Berhasil Mengudara!'}</h4>
                                            
                                            {publishStep === 4 && (
                                                <div className="space-y-4">
                                                    {/* KOTAK HASIL LINK (Bisa disalin/buka eksternal) */}
                                                    <div className="p-4 bg-gray-50 border border-gray-200 rounded-2xl flex items-center justify-between gap-3 mt-4">
                                                        <div className="flex-1 overflow-hidden text-left">
                                                            <span className="text-[9px] font-black text-gray-400 block mb-1 uppercase tracking-wider">Tautan Publik Anda:</span>
                                                            <a href={`${workerUrl}/site/${subdomainInput}`} target="_blank" rel="noopener noreferrer" className="text-sm font-bold text-indigo-600 hover:text-indigo-800 break-all truncate block">
                                                                {workerUrl}/site/{subdomainInput}
                                                            </a>
                                                        </div>
                                                        <div className="flex gap-1">
                                                            <button 
                                                                onClick={() => { navigator.clipboard.writeText(`${workerUrl}/site/${subdomainInput}`); showToast('Tautan disalin ke papan klip!'); }} 
                                                                className="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition-all flex-shrink-0" 
                                                                title="Salin Tautan"
                                                            >
                                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                                            </button>
                                                            <a 
                                                                href={`${workerUrl}/site/${subdomainInput}`} target="_blank" rel="noopener noreferrer"
                                                                className="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition-all flex-shrink-0" 
                                                                title="Buka di Tab Baru"
                                                            >
                                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                                            </a>
                                                        </div>
                                                    </div>

                                                    <button onClick={() => { setShowPublishModal(false); setViewMode('browser'); setBrowserAddress(`${workerUrl}/site/${subdomainInput}`); }} className="w-full py-3.5 bg-gray-900 text-white rounded-full font-bold hover:bg-gray-800 transition shadow-lg">Buka di Manajer Situs Internal</button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* MODAL PIN KEAMANAN SEBELUM PENGATURAN */}
                        {showPinModal && (
                            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[110] animate-fadeIn">
                                <div className="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl animate-scaleIn relative text-center">
                                    <button onClick={() => { setShowPinModal(false); setPinInput(''); }} className="absolute top-4 right-4 text-gray-400 hover:text-gray-900"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                    </div>
                                    <h3 className="text-xl font-extrabold text-gray-900 mb-2">Area Terbatas</h3>
                                    <p className="text-gray-500 text-sm mb-6">Masukkan PIN keamanan Admin S-Tools untuk mengakses gerbang konfigurasi.</p>
                                    
                                    <div className="space-y-4">
                                        <input 
                                            type="password" 
                                            maxLength="6"
                                            value={pinInput} 
                                            onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ''))} 
                                            onKeyDown={(e) => e.key === 'Enter' && handlePinSubmit()}
                                            className="w-full text-center text-2xl tracking-[0.5em] bg-gray-50 border border-gray-200 focus:bg-white focus:border-red-500 rounded-xl px-4 py-3 font-bold text-gray-900 outline-none transition" 
                                            placeholder="••••••"
                                        />
                                        <button onClick={handlePinSubmit} className="w-full py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full font-bold shadow-lg shadow-red-500/30 transition transform">Buka Pengaturan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL SETTINGS: WORKER CONFIG */}
                        {showSettingsModal && (
                            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fadeIn">
                                <div className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl animate-scaleIn relative">
                                    <button onClick={() => setShowSettingsModal(false)} className="absolute top-6 right-6 text-gray-400 hover:text-gray-900"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    <h3 className="text-2xl font-extrabold text-gray-900 mb-2">Konfigurasi Gateway</h3>
                                    <p className="text-gray-500 text-sm mb-6">Mengamankan jaringan Anda ke S-Tools Database Pusat.</p>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase tracking-wide">Endpoint Domain Gateway</label>
                                            <input type="text" value={workerUrl} onChange={(e) => setWorkerUrl(e.target.value)} className="mt-2 w-full bg-gray-50 border border-gray-200 focus:bg-white focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-gray-900 outline-none transition font-mono" />
                                        </div>
                                        <div className="p-4 bg-gray-50 rounded-xl text-xs text-gray-600 flex justify-between items-center border border-gray-200">
                                            <span>Status Integrasi Sistem:</span>
                                            <strong className={serverStatus === 'connected' ? 'text-green-600 flex items-center gap-1.5' : 'text-red-600 flex items-center gap-1.5'}>
                                                <span className={`w-2 h-2 rounded-full ${serverStatus === 'connected' ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                                {serverStatus === 'connected' ? 'Aman (Terkoneksi)' : 'Tidak Valid'}
                                            </strong>
                                        </div>
                                        <button onClick={() => { testWorkerConnection(); setShowSettingsModal(false); }} className="w-full py-3.5 bg-gray-900 text-white hover:bg-gray-800 rounded-full font-bold shadow-lg transition transform">Simpan Pengaturan</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
